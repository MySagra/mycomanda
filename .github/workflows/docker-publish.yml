name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mysagra-mycomanda

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Extract metadata and generate the image tags
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/mysagra/${{ env.IMAGE_NAME }}
          tags: |
            # 'latest' when the event runs on the default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Release tag name (e.g. v1.0.0)
            type=ref,event=tag
            # Branch name when started manually (e.g. main or development)
            type=ref,event=branch
            # Always tag with the short commit SHA (e.g. sha-a1b2c3d)
            type=sha,format=short

      # 2. Build and push with the generated metadata
      - name: Build and push mycomanda image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
