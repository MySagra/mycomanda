<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>MyComanda - Offline</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: #09090b; color: #fafafa; font-family: system-ui, sans-serif; text-align: center; padding: 16px;
      }
      img { width: 96px; height: auto; }
      h1 { font-size: 1.25rem; margin: 0; }
      p { margin: 0; color: #a1a1aa; }
      button {
        margin-top: 8px; padding: 10px 20px; border: 0; border-radius: 8px;
        background: #fecc02; color: #09090b; font-weight: 600; font-size: 1rem; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/logo.svg" alt="MyComanda" />
    <h1 id="title">Sei offline</h1>
    <p id="text">Impossibile raggiungere il server. Controlla la connessione.</p>
    <button id="retry" onclick="location.reload()">Riprova</button>
    <script>
      // Same language the app saved (I18nProvider stores it in localStorage).
      var strings = {
        en: { title: "You are offline", text: "Unable to reach the server. Check your connection.", retry: "Retry" },
      };
      var lang;
      try { lang = localStorage.getItem("app_lang"); } catch (e) {}
      var t = strings[lang];
      if (t) {
        document.documentElement.lang = lang;
        document.title = "MyComanda - Offline";
        for (var id in t) document.getElementById(id).textContent = t[id];
      }
    </script>
  </body>
</html>
